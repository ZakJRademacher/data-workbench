# Scorecard scores the default branch, so it runs on pushes to main and weekly.
name: scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    uses: ZakJRademacher/portfolio-ci/.github/workflows/scorecard.yml@e2365dabafc74c0cd450d1a9a4201f92ec17d518 # v1.0.0 + e2365da
    permissions:
      contents: read
      actions: read
      security-events: write
