name: AI suggestion eval
# Scores AI-suggested recipes against the reference recipes on real data
# (realdata/ai_eval.py). Needs the ANTHROPIC_API_KEY repository secret; each run
# makes four Claude API calls (about $1-2). Runs when the AI files change on the
# feature/ai-suggestions branch, or on demand once this file is on main. Without
# a key it skips with a notice instead of failing.
on:
  push:
    branches: [feature/ai-suggestions]
    paths:
      - workbench/ai_suggest.py
      - realdata/ai_eval.py
      - .github/workflows/ai-eval.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check for an API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No ANTHROPIC_API_KEY repository secret, so the eval was skipped."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.key.outputs.present == 'true'
        run: python -m pip install -r requirements.lock.txt "anthropic>=2,<3"
      - if: steps.key.outputs.present == 'true'
        run: python -m realdata.fetch --cache .realdata-cache
      - name: Score AI suggestions against the reference recipes
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -B -m realdata.ai_eval --cache .realdata-cache --out ai-eval.json
      - name: Full report
        if: always() && steps.key.outputs.present == 'true'
        run: python -c "import pathlib; p=pathlib.Path('ai-eval.json'); print(p.read_text() if p.exists() else 'No report written.')"
